 <ellipse cx="256" cy="256" rx="218" ry="78" stroke="url(#ring)" stroke-width="12"/>
 <ellipse cx="256" cy="256" rx="185" ry="58" stroke="#fff1cf" stroke-width="3" opacity=".9"/>
 <path d="M38 256 A218 78 0 0 1 474 256" stroke="#fff5dc" stroke-width="5"/>
 <path d="M38 256 A218 78 0 0 0 474 256" stroke="#ff3a3d" stroke-width="8" opacity=".9"/>
