<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <radialGradient id="core" cx="50%" cy="50%" r="58%"><stop offset="0" stop-color="#fffef3"/><stop offset=".18" stop-color="#fff1be"/><stop offset=".42" stop-color="#ff9c45"/><stop offset=".72" stop-color="#f12c39"/><stop offset="1" stop-color="#6d0718" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8df"/><stop offset=".22" stop-color="#ffaf4d"/><stop offset=".48" stop-color="#f52d3d"/><stop offset=".74" stop-color="#8f0b22"/><stop offset="1" stop-color="#fff0ce"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="plasma"><stop stop-color="#fffde8"/><stop offset=".23" stop-color="#ffc36b"/><stop offset=".58" stop-color="#ff4a3c"/><stop offset="1" stop-color="#b10c25" stop-opacity="0"/></radialGradient>
</defs>
<!-- jagged stellar ejecta -->
<g filter="url(#glow)" fill="#ec2839" opacity=".85">
 <path d="M256 45 272 179 323 102 303 197 413 129 333 224 475 208 345 259 457 331 323 292 354 437 281 322 256 474 235 323 144 425 209 299 57 350 194 258 42 208 205 222 133 100 226 191Z"/>
</g>
<!-- tilted plasma rings -->
