# Keyless generic ACP v1 control-surface patch over `snh --profile acp`.

- id: llm-supernova
  name: '@supernova-ai/snh-llm-deepseek-api-key'
  disabled: true

- id: acp
  name: '@supernova-ai/snh-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js process.env.SNH_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
