# Patch for resuming one seeded workspace-instruction session over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-supernova
  disabled: true

- id: agent-instructions
  config:
    maxBytes: 65536

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        file: !!js process.env.SNH_SNAPSHOT_FILE
        overrideFile: !!js process.env.SNH_SNAPSHOT_OVERRIDE

    # Publish the persisted agent before the driver selects the single root.
    - id: resumed-agent
      name: './tests/fixtures/workspace-context-resume-agent.ts'

- id: session-log-supernova
  config:
    enabled: false

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.SNH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
