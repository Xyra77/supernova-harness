# Workspace-context snapshot patch: the harness exports SNH_HOME=<cwd>/.snh and
# SNH_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@supernova-ai/snh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: !!js 'process.env.SNH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@supernova-ai/snh-agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .snh-project

- id: system-prompt
  name: '@supernova-ai/snh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
