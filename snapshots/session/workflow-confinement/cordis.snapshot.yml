# Replay the authored model turns through the shipped OS sandbox.
- id: llm-supernova
  name: '@supernova-ai/snh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-supernova
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
