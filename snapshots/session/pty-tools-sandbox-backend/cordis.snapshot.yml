# Keyless replay counterpart to pty.cordis.yml.
- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  disabled: true

- insert:
    - id: pty
      name: '@supernova-ai/snh-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@supernova-ai/snh-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: plugin-package-inventory-supernova
  disabled: true
