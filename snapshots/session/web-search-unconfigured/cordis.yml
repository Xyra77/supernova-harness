# Live-recording patch: the search key reference names no credential, so the
# model request withholds web_search while the rest of the tool surface stays.
- id: web-supernova-api
  name: '@supernova-ai/snh-web-supernova-api'
  config:
    searchApiKeyEnv: SNH_SNAPSHOT_UNSET_SEARCH_KEY

- id: web-search-supernova
  config:
    apiKeyEnv: SNH_SNAPSHOT_UNSET_SEARCH_KEY
