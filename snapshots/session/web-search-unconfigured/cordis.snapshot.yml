# Keyless replay counterpart: the ordinary headless replay patch plus a search
# key reference that names no credential.

- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  disabled: true

- id: plugin-package-inventory-supernova
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: none

- id: sandbox
  name: '@supernova-ai/snh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: SuperNova Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: web-supernova-api
  name: '@supernova-ai/snh-web-supernova-api'
  config:
    searchApiKeyEnv: SNH_SNAPSHOT_UNSET_SEARCH_KEY

- id: web-search-supernova
  config:
    apiKeyEnv: SNH_SNAPSHOT_UNSET_SEARCH_KEY
