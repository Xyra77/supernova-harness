# The Linear grant lives in the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-manager
      name: '@supernova-ai/snh-mcp-manager'
      inject: [credentials, mcpResources]
    - id: linear
      name: '@supernova-ai/snh-linear'
      config:
        url: !!js process.env.SNH_MCP_DEMO_URL
