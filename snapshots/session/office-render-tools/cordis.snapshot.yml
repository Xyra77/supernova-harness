# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  disabled: true

- id: plugin-package-inventory-supernova
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: none

- id: sandbox
  name: '@supernova-ai/snh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-v4-flash
                toolUpdate: in-history
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: SuperNova Messages
            models:
              - id: deepseek-v4-flash
                toolUpdate: in-history
              - id: deepseek-v4-pro

- insert:
    - id: office-kit
      name: '@supernova-ai/snh-office-kit'
      config:
        outputDirectory: !!js snhHomePath('office-kit', 'outputs')

    - id: tool-office
      name: '@supernova-ai/snh-tool-office'

    - id: skill-office
      name: '@supernova-ai/snh-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        pythonEnvironment: user

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
