- id: agent-default-model
  name: '@supernova-ai/snh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: none

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@supernova-ai/snh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: attachment-local
  name: '@supernova-ai/snh-attachment-local'

- insert:
    - id: computer-use
      name: '@supernova-ai/snh-computer-use'
    - id: cua-native
      name: '@supernova-ai/snh-cua-macos'
      config:
        agentPreset: false
        helperPath: !!js process.cwd() + '/native-helper.mjs'
        allowedApps: [{"id": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "name": "Fixture", "executablePath": "/fixture/app"}]

- id: user-questions
  name: '@supernova-ai/snh-user-questions'

- insert:
    - id: cua-permission-fixture
      name: './permission-fixture.mjs'

# Recorded programs are async function bodies, so replay keeps the per-call runtime.
- id: ptc-runtime
  config:
    executionMode: per-call
