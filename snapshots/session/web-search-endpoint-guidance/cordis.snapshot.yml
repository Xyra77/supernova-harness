# Keyless replay counterpart: the failed search remains real; only the
# conversation model adapter is replaced by replay.
- id: llm-supernova
  name: '@supernova-ai/snh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-supernova
  disabled: true

- insert:
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro

    - id: web-search-error-fixture
      name: './web-search-error-fixture.mjs'

- id: web-supernova-api
  name: '@supernova-ai/snh-web-supernova-api'
  config:
    searchApiKeyEnv: SNH_SNAPSHOT_SEARCH_KEY
    # The fixture maps this recorded authority to its OS-assigned listener.
    searchBaseURL: http://127.0.0.1:43118/api/v1/tools

# The conversation runs on a SuperNova model route, where an unconfigured search selects Messages search.
- id: web
  name: '@supernova-ai/snh-web'
  config:
    searchProvider: supernova-search-api
    fetchProvider: http
