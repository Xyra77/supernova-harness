- insert:
    - id: mcp-tool-loading
      name: '@supernova-ai/snh-mcp-client'
      config:
        transport: streamable-http
        serverName: demo
        url: !!js process.env.SNH_MCP_DEMO_URL
        toolLoading: on-demand
        failOnStartupError: true
        reconnect:
          enabled: false
