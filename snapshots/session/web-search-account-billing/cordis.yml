# Authored composition: a conversation on a non-SuperNova model provider, a signed-in SuperNova account, and no
# SuperNova API key, with automatic Search billing. The account route stays unmounted so
# the account token goes to the default account origin.
- id: llm-supernova
  name: '@supernova-ai/snh-llm-deepseek-api-key'
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: plugin-package-inventory-supernova
  disabled: true

- insert:
    - id: web-search-billing-fixture
      name: './web-search-billing-fixture.mjs'

- id: web-supernova-api
  name: '@supernova-ai/snh-web-supernova-api'
  config:
    searchBilling: auto
