# The Tencent Docs grant lives in the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-manager
      name: '@supernova-ai/snh-mcp-manager'
      inject: [credentials, mcpResources]
    - id: tencent-docs
      name: '@supernova-ai/snh-tencent-docs'
      config:
        url: !!js process.env.SNH_MCP_DEMO_URL
