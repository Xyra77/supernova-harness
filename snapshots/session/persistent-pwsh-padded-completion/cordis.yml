# Minimal live counterpart for the persistent-pwsh-padded-completion snapshot composition.
- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@supernova-ai/snh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@supernova-ai/snh-subprocess-local'

- insert:
    - id: terminal
      name: '@supernova-ai/snh-terminal'

- insert:
    - id: padded-pwsh-backend
      name: './pwsh-snapshot-backend.mjs'

- id: agent-default-model
  name: '@supernova-ai/snh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: !!js 'process.env.SNH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@supernova-ai/snh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@supernova-ai/snh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@supernova-ai/snh-tool-jobs'
  disabled: true

- id: goal
  name: '@supernova-ai/snh-goal'
  disabled: true

- id: goal-round-driver
  name: '@supernova-ai/snh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@supernova-ai/snh-command-goal'
  disabled: true

- id: tool-goal
  name: '@supernova-ai/snh-tool-goal'
  disabled: true

- id: skill
  name: '@supernova-ai/snh-skill'
  disabled: true

- id: skill-filesystem
  name: '@supernova-ai/snh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@supernova-ai/snh-tool-skill'
  disabled: true

- id: upstream-skills
  name: '@supernova-ai/snh-upstream-skills'
  disabled: true

- id: tool-bash
  name: '@supernova-ai/snh-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@supernova-ai/snh-tool-pwsh-persistent'
