- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  disabled: true

- id: plugin-package-inventory-supernova
  disabled: true

- id: agent-default-model
  name: '@supernova-ai/snh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: none

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: ptc-runtime
  config:
    # Recorded programs are async function bodies.
    executionMode: per-call
    maxOutputBytes: 4096

- id: system-prompt
  name: '@supernova-ai/snh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@supernova-ai/snh-attachment-local'

- insert:
    - id: computer-use
      name: '@supernova-ai/snh-computer-use'
    - id: cua-native
      name: '@supernova-ai/snh-cua-macos'
      config:
        agentPreset: false
        helperPath: !!js process.cwd() + '/native-helper.mjs'

- id: user-questions
  name: '@supernova-ai/snh-user-questions'

- insert:
    - id: cua-consent-fixture
      name: './consent-fixture.mjs'
