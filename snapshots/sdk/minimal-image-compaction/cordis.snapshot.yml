- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-flash
                inputModalities: [text, image]
                contextWindow: 1000000

- id: compaction-basic
  config:
    thresholdRatio: 0.001
    headroomTokens: 256
    retainTokens: 64
    maxTokens: 256
