# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@supernova-ai/snh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-supernova
  name: '@supernova-ai/snh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: !!js "process.env.SNH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@supernova-ai/snh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: session-log-supernova
  config:
    enabled: false
