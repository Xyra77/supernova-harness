# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@supernova-ai/snh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: SuperNova
            models:
              - id: deepseek-v4-flash

# Recorded programs are async function bodies, so replay keeps the per-call runtime.
- id: ptc-runtime
  config:
    executionMode: per-call
