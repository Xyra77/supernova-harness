# TypeScript SDK snapshot-record patch over `snh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@supernova-ai/snh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-supernova
  name: '@supernova-ai/snh-llm-supernova-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@supernova-ai/snh-session-persistence-jsonl'
  config:
    root: !!js snhHomePath('sessions')
    compression: !!js "process.env.SNH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@supernova-ai/snh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: session-log-supernova
  name: '@supernova-ai/snh-session-log-supernova'
  config:
    enabled: true

- insert:
    - id: serial-created-fixture
      name: '../../../packages/core/agent-loop/tests/fixtures/serial-created.mjs'
      config:
        checkRootCancellation: true
