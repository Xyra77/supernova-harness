# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@supernova-ai/snh-system-prompt'

- id: fs
  name: '@supernova-ai/snh-fs-local'

- id: session-projections
  name: '@supernova-ai/snh-session-projection'

- id: working-directory
  name: '@supernova-ai/snh-working-directory'

- id: tools
  name: '@supernova-ai/snh-tools'

- id: tool-executor-native
  name: '@supernova-ai/snh-tool-executor-native'

- id: subprocess
  name: '@supernova-ai/snh-subprocess-local'

- id: bash
  name: '@supernova-ai/snh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@supernova-ai/snh-shell-env'

- id: tasks
  name: '@supernova-ai/snh-jobs-local'

- id: tool-jobs
  name: '@supernova-ai/snh-tool-jobs'

- id: tool-pwsh
  name: '@supernova-ai/snh-tool-pwsh'
