- insert:
    - id: cua-provider-registry
      name: '@supernova-ai/snh-computer-use'
    - id: cua-macos
      name: '@supernova-ai/snh-cua-macos'
      disabled: !!js process.platform !== 'darwin'
      config:
        agentPreset: ptc
    - id: cua-windows
      name: '@supernova-ai/snh-cua-windows'
      disabled: !!js process.platform !== 'win32'
      config:
        agentPreset: ptc
    - id: ui-cua
      name: '@supernova-ai/snh-cua'
